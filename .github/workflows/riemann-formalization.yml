name: Riemann formalization

on:
  push:
    paths:
      - "03_CONTENT_CORE/millennium/riemann/bicomplex-riemann-formalization/**"
      - ".github/workflows/riemann-formalization.yml"
  pull_request:
    paths:
      - "03_CONTENT_CORE/millennium/riemann/bicomplex-riemann-formalization/**"
      - ".github/workflows/riemann-formalization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean build and axiom audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: 03_CONTENT_CORE/millennium/riemann/bicomplex-riemann-formalization
          build: true
          test: false
          use-mathlib-cache: false
          axiom-audit: true
          axiom-audit-root: Formal
